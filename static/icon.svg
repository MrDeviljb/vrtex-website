<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00cc6a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#080a0f"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Vrtex V Logo with gaming glow -->
  <g filter="url(#glow)">
    <path d="M18 18 L32 46 L46 18" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <polygon points="32,38 27,28 37,28" fill="url(#neonGrad)" />
  </g>
</svg>
